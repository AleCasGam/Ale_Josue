    <!-- Previsualización al compartir el link (WhatsApp, Facebook, Telegram, iMessage…).
         Reglas que hay que respetar o la miniatura no aparece:
         - Las URLs de og:url y og:image tienen que ser ABSOLUTAS, no rutas relativas.
         - La imagen debe ser JPG o PNG (WhatsApp no lee WebP aquí) y pesar poco.
         public/preview.jpg lo genera `npm run generar-preview`. Si se reemplaza la
         foto, súbele el `?v=` para que WhatsApp no siga sirviendo la vieja de caché. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Alejandra &amp; Josué" />
    <meta property="og:url" content="https://ale-josue.pages.dev/" />
    <meta property="og:title" content="Alejandra &amp; Josué · Nos casamos" />
    <meta property="og:description" content="03 de octubre de 2026. Con el corazón lleno de alegría te invitamos a celebrar con nosotros." />
    <meta property="og:image" content="https://ale-josue.pages.dev/preview.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://ale-josue.pages.dev/preview.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alejandra y Josué abrazados frente al cerro, con la fecha 03.10.2026" />
